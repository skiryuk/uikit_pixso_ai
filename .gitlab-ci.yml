stages:
  - design_fetch_diff

default:
  interruptible: true

design:fetch_diff:
  stage: design_fetch_diff
  image: python:3.12-slim
  tags:
    - design-sync
  variables:
    # Обязательные CI variables: PIXSO_TOKEN и PIXSO_FILE.
    # Опционально можно переопределить endpoint шаблон.
    PIXSO_SNAPSHOT_URL_TEMPLATE: "https://pixso.net/api/v1/files/{file_id}/snapshot"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "pipeline"'
  before_script:
    - python3 --version
    - test -n "${PIXSO_TOKEN:-}" || (echo "ERROR: PIXSO_TOKEN is not set" && exit 1)
    - test -n "${PIXSO_FILE:-}" || (echo "ERROR: PIXSO_FILE is not set" && exit 1)
    - echo "PIXSO_TOKEN is set (masked)"
    - echo "PIXSO_FILE is set (masked)"
    - mkdir -p build/design-sync
  script:
    - python3 tool/design_fetch_diff.py
  after_script:
    - mkdir -p build/design-sync
    - test -f build/design-sync/design_snapshot_new.json || echo '{}' > build/design-sync/design_snapshot_new.json
    - test -f build/design-sync/design_diff.json || echo '{}' > build/design-sync/design_diff.json
    - test -f build/design-sync/impact_report.json || echo '{}' > build/design-sync/impact_report.json
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - build/design-sync/design_snapshot_new.json
      - build/design-sync/design_diff.json
      - build/design-sync/impact_report.json
